unbind C-b

set-option -g prefix C-Space
bind C-Space send-prefix

bind -n M-H previous-window
bind -n M-L next-window

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"

bind d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
  "zshrc"            z  "display-popup -E 'nvim ~/.zshrc'" \
  "tmux"        t  "display-popup -E 'nvim ~/.config/tmux/tmux.conf'" \
  "nvim"        n  "display-popup -E 'nvim ~/.config/nvim/init.lua'" \
  "kitty"       none  "display-popup -E 'nvim ~/.config/kitty/kitty.conf'" \
  "exit"        	  q  ""

bind C-g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"

bind C-p display-popup -E "python3"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config soursed !"
