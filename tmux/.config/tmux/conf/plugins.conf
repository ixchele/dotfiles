set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin "janoamaral/tokyo-night-tmux"

# NOTE : toyo-night
# set -g @tokyo-night-tmux_window_id_style fsquare
# set -g @tokyo-night-tmux_pane_id_style hsquare
# set -g @tokyo-night-tmux_zoom_id_style dsquare
# set -g @tokyo-night-tmux_show_path 1
# set -g @tokyo-night-tmux_path_format relative
# set -g @tokyo-night-tmux_show_datetime 1
# set -g @tokyo-night-tmux_date_format DMY
# set -g @tokyo-night-tmux_time_format 24H

set -g @plugin 'fabioluciano/tmux-powerkit'

set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_transparent "true"
set -g @powerkit_status_position "bottom"
set -g @powerkit_plugins "datetime,hostname"
set -g @powerkit_separator_style "slant"  # or normal, flame, pixel, honeycomb
set -g @powerkit_edge_separator_style "slant"  # or normal, flame, pixel, honeycomb
set -g @powerkit_plugin_datetime_icon "  "
set -g @powerkit_plugin_hostname_icon "  "
set -g @powerkit_status_order "session,windows,plugins"
set -g @powerkit_status_justify "centre"

set -g @plugin 'lloydbond/tmux-floating-terminal'

set -g @floating_scratch_term 't'
# set -g @floating_scratch_to_active_win 'M-h'
# set -g @floating_scratch_to_win 'M-l'
# set -g @floating_active_pane_to_scratch 'M-m'


set -g @plugin 'alexwforsythe/tmux-which-key'

run '~/.local/share/tmux/plugins/tpm/tpm'
